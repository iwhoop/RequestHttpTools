<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每3秒自动请求URL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 30px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #a0a0ff;
            font-size: 1.1rem;
        }
        
        .config-section {
            background: rgba(20, 30, 48, 0.6);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4facfe;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid #3498db;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        #startBtn {
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
        }
        
        #stopBtn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .status-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .status-card {
            background: rgba(20, 30, 48, 0.6);
            padding: 20px;
            border-radius: 15px;
            flex: 1;
            text-align: center;
        }
        
        .status-card h3 {
            color: #4facfe;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .status-value {
            font-size: 1.8rem;
            font-weight: bold;
        }
        
        .success {
            color: #00f2fe;
        }
        
        .error {
            color: #ff416c;
        }
        
        .response-section {
            background: rgba(20, 30, 48, 0.6);
            padding: 20px;
            border-radius: 15px;
            margin-top: 25px;
        }
        
        .response-section h2 {
            color: #4facfe;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .response-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
            color: #e0e0ff;
        }
        
        .timestamp {
            color: #96c93d;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .log-entry {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .success-log {
            border-left: 4px solid #00f2fe;
        }
        
        .error-log {
            border-left: 4px solid #ff416c;
        }
        
        .request-info {
            margin-top: 10px;
            color: #a0a0ff;
            font-size: 0.9rem;
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            .status-section {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-sync-alt"></i> 每3秒自动请求URL</h1>
            <p class="subtitle">实时监控API状态，自动发送GET请求</p>
        </header>
        
        <div class="config-section">
            <div class="input-group">
                <label for="urlInput"><i class="fas fa-link"></i> 目标URL</label>
                <input type="url" id="urlInput" placeholder="http://api.xxxx.com/api" value="http://api.xxxx.com/api">
            </div>
            
            <div class="input-group">
                <label for="intervalInput"><i class="fas fa-clock"></i> 请求间隔 (毫秒)</label>
                <input type="number" id="intervalInput" min="100" max="10000" value="3000">
            </div>
            
            <div class="btn-group">
                <button id="startBtn"><i class="fas fa-play"></i> 开始请求</button>
                <button id="stopBtn"><i class="fas fa-stop"></i> 停止请求</button>
            </div>
        </div>
        
        <div class="status-section">
            <div class="status-card">
                <h3><i class="fas fa-check-circle"></i> 成功请求</h3>
                <div id="successCount" class="status-value success">0</div>
            </div>
            
            <div class="status-card">
                <h3><i class="fas fa-exclamation-circle"></i> 失败请求</h3>
                <div id="errorCount" class="status-value error">0</div>
            </div>
            
            <div class="status-card">
                <h3><i class="fas fa-hourglass-half"></i> 上次状态</h3>
                <div id="lastStatus" class="status-value">等待开始</div>
            </div>
        </div>
        
        <div class="response-section">
            <h2><i class="fas fa-file-code"></i> 响应日志</h2>
            <div id="responseContainer" class="response-container">
                <div class="log-entry">
                    <div class="timestamp">准备就绪 - 输入URL并点击开始按钮</div>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>每3秒自动请求URL监控工具 &copy; 2023</p>
    </footer>

    <script>
        // 页面元素
        const urlInput = document.getElementById('urlInput');
        const intervalInput = document.getElementById('intervalInput');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const successCount = document.getElementById('successCount');
        const errorCount = document.getElementById('errorCount');
        const lastStatus = document.getElementById('lastStatus');
        const responseContainer = document.getElementById('responseContainer');
        
        // 状态变量
        let intervalId = null;
        let successCounter = 0;
        let errorCounter = 0;
        
        // 开始请求
        startBtn.addEventListener('click', () => {
            if (intervalId) {
                clearInterval(intervalId);
            }
            
            const url = urlInput.value;
            const interval = parseInt(intervalInput.value);
            
            if (!url) {
                showError('请输入有效的URL');
                return;
            }
            
            if (isNaN(interval) || interval < 100 || interval > 10000) {
                showError('间隔时间必须在100ms到10000ms之间');
                return;
            }
            
            // 立即执行第一次请求
            makeRequest(url);
            
            // 设置定时器
            intervalId = setInterval(() => {
                makeRequest(url);
            }, interval);
            
            lastStatus.textContent = '运行中...';
            lastStatus.className = 'status-value success';
            addLogEntry('开始定时请求', `URL: ${url} | 间隔: ${interval}ms`, 'success');
        });
        
        // 停止请求
        stopBtn.addEventListener('click', () => {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
                lastStatus.textContent = '已停止';
                lastStatus.className = 'status-value error';
                addLogEntry('已停止定时请求', '请求已停止', 'error');
            }
        });
        
        // 发送GET请求
        async function makeRequest(url) {
            const startTime = Date.now();
            const timestamp = new Date().toLocaleTimeString();
            
            try {
                const response = await fetch(url);
                const endTime = Date.now();
                const duration = endTime - startTime;
                
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态: ${response.status}`);
                }
                
                const data = await response.json();
                
                // 更新成功计数
                successCounter++;
                successCount.textContent = successCounter;
                lastStatus.textContent = '成功';
                lastStatus.className = 'status-value success';
                
                // 添加日志
                addLogEntry(
                    `请求成功 (${response.status})`, 
                    `耗时: ${duration}ms | URL: ${url}`,
                    'success',
                    data
                );
                
            } catch (error) {
                // 更新错误计数
                errorCounter++;
                errorCount.textContent = errorCounter;
                lastStatus.textContent = '失败';
                lastStatus.className = 'status-value error';
                
                // 添加日志
                addLogEntry(
                    `请求失败: ${error.message}`, 
                    `URL: ${url}`,
                    'error'
                );
            }
        }
        
        // 添加日志条目
        function addLogEntry(title, info, type, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}-log`;
            
            logEntry.innerHTML = `
                <div class="timestamp">${timestamp}</div>
                <div><strong>${title}</strong></div>
                <div class="request-info">${info}</div>
            `;
            
            if (data) {
                const dataElement = document.createElement('pre');
                dataElement.className = 'response-data';
                dataElement.textContent = JSON.stringify(data, null, 2);
                logEntry.appendChild(dataElement);
            }
            
            responseContainer.prepend(logEntry);
            
            // 限制日志数量
            if (responseContainer.children.length > 20) {
                responseContainer.removeChild(responseContainer.lastChild);
            }
        }
        
        // 显示错误
        function showError(message) {
            const errorElement = document.createElement('div');
            errorElement.className = 'log-entry error-log';
            errorElement.innerHTML = `
                <div class="timestamp">${new Date().toLocaleTimeString()}</div>
                <div><strong>配置错误</strong></div>
                <div>${message}</div>
            `;
            
            responseContainer.prepend(errorElement);
        }
    </script>
</body>
</html>
